<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Game</title>
</head>
<body style="margin: 0;">

    <div class="imagem">
        <img src="https://images.playground.com/982d3b59-0cd3-4a13-b49a-ab1bef6a08a0.jpeg"
             alt="Imagem de Fundo"
             style="width: 100%; height: 100vh; object-fit: cover;">
    </div>

    <div class="GameOver"
         style="
            position: absolute;
            top: 0;
            left: 0;
            width: 30%;
            height: 30vh;
            display: flex;
            flex-direction: column;
            justify-content: upcenter;
            align-items: upcenter;
         ">
        <h1 style="color: rgb(43, 255, 0);">Você conseguiu coletar 10 materiais!</h1>

        <button onclick="window.location.href = 'MENU.html';"
                style="
                    border: 2px solid #00ff55;
                    padding: 10px 20px;
                    font-size: 18px;
                ">
            Ir para o MENU
        </button>
    </div>

</body>
</html>
